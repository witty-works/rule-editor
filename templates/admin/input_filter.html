<div class="grp-module">
    <div class="grp-row">
        <label>{{ title }}</label>

        {% with choices.0 as all_choice %}
        <form method="GET" action="">

            {% for k, v in all_choice.query_parts %}
            <input type="hidden" name="{{ k }}" value="{{ v }}" />
            {% endfor %}

            <input class="grp-filter-choice" type="text" value="{{ spec.value|default_if_none:'' }}"
                name="{{ spec.parameter_name }}" />

            {% if not all_choice.selected %}
            <strong><a href="{{ all_choice.query_string }}">⨉ Remove</a></strong>
            {% endif %}
        </form>
        {% endwith %}
    </div>
</div>
